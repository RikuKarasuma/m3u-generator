# M3U Generator Configuration Template
# Copy to /etc/m3u-generator/generator.conf and customize

# WebDAV Connection Settings
webdav-url=https://user:password@server/dav/
webdav-timeout=60

# Source Directories (comma-separated paths)
source-directories=/mnt/movies:/mnt/tvshows

# Output Directory for generated playlists
output-directory=/var/www/html/m3u/

# M3U Playlist Settings
playlist-prefix=/
playlist-encoding=UTF-8
playlist-line-limit=100

# File Extensions to include (comma-separated, empty = all)
file-extensions=mp4,mkv,avi,mov,wv,

# Error Handling
retry-count=3
retry-delay=5
error-log=/var/log/m3u-generator/errors.log

# Logging
log-level=info
log-file=/var/log/m3u-generator/m3u-generator.log
