# Logrotate configuration for M3U Generator
# Daily rotation, keep 14 days of logs

/var/log/m3u-generator/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        # Restart service to ensure log file rotation is picked up
        systemctl reload-or-restart m3u-generator.service >/dev/null 2>&1 || true
    endscript
}
